name: nightly-monitoring
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - name: Generate synthetic data
        run: |
          python scripts/generate_synthetic.py --rows 5000 --seed 42                 --out data/reference.csv
          python scripts/generate_synthetic.py --rows 5000 --seed 43                 --drift 0.15 --out data/current.csv
      - name: Run monitoring
        run: |
          python pipelines/monitor.py --reference data/reference.csv                 --current data/current.csv || echo "exit=$?"
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-${{ github.run_id }}
          path: |
            artifacts/monitoring/monitoring_summary.json
            artifacts/monitoring/psi_csi_metrics.csv
            reports/monitoring_report.md
      - name: Read alert level
        id: level
        if: ${{ hashFiles('artifacts/monitoring/monitoring_summary.json') != '' }}
        run: |
          python -c "import json; print('level=' + json.load(open('artifacts/monitoring/monitoring_summary.json'))['overall_alert_level'])" >> "$GITHUB_OUTPUT"
      - name: Open alert issue
        if: ${{ steps.level.outputs.level == 'escalate' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Monitoring alert ${{ github.run_id }}"
          content-filepath: reports/monitoring_report.md
          labels: monitoring-alert
