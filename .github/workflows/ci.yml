name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # No LFS needed: only loan_data_2015.csv is in LFS and nothing in CI reads it.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src api pipelines tests scripts
      # Includes tests/test_pipelines_e2e.py (train -> validate -> monitor -> API).
      - run: pytest
      - name: Pipeline smoke test (CLI)
        run: |
          set -euo pipefail
          python pipelines/train.py --rows 5000
          python pipelines/validate.py --bootstrap 50
          python scripts/generate_synthetic.py --rows 3000 --seed 101 --out data/reference.csv
          python scripts/generate_synthetic.py --rows 3000 --seed 102 --out data/current.csv
          python pipelines/monitor.py --reference data/reference.csv --current data/current.csv
          python -m credit_risk_model.governance.audit verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build image (trains the demo model during the build)
        run: docker build -t credit-risk:ci .
      - name: Smoke test container (no governance override)
        run: |
          docker run -d --name cr-smoke -p 8000:8000 -e ENVIRONMENT=ci credit-risk:ci
          python scripts/smoke_test.py --url http://localhost:8000 --timeout 60 \
            || { docker logs cr-smoke; exit 1; }
      - name: Tear down
        if: always()
        run: docker rm -f cr-smoke || true
