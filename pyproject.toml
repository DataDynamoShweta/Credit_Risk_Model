[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-model-validation"
version = "0.1.0"
description = "Modular credit risk scorecard and independent model validation toolkit with LangGraph agent workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "joblib>=1.3",
  "scipy>=1.10",
  "jinja2>=3.1",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "langgraph>=0.2",
  "openai>=1.12",
  "python-dotenv>=1.0",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]
registry = ["mlflow>=2.12"]
pdf = ["Markdown>=3.6", "weasyprint>=62"]
monitoring = ["evidently>=0.7"]
challengers = ["xgboost>=2.0", "lightgbm>=4.0"]
explain = ["shap>=0.45"]
all = ["credit-risk-model-validation[dev,explain,pdf]"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["credit_risk_model*", "credit_risk_agents*", "api*", "pipelines*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-p no:langsmith_plugin"

[tool.ruff]
line-length = 100
