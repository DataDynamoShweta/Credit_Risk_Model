services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: docker-compose
      # Set to enable the /audit endpoints (Authorization: Bearer <token>).
      AUDIT_API_TOKEN: ${AUDIT_API_TOKEN:-}
    volumes:
      # Audit records survive container restarts and removal.
      - audit_trail:/app/governance/audit_trail
      # To serve your own artefact instead of the demo model trained in the image:
      # - ./artifacts:/app/artifacts:ro
    # The image defines a HEALTHCHECK that requires model_loaded=true.

volumes:
  audit_trail:
