name: cd
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          [[ "${GITHUB_REF}" == refs/tags/* ]] &&                 echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] &&                 echo "latest=true" >> "$GITHUB_OUTPUT"
          true
      - name: Build image
        run: docker build -t credit-risk:${{ steps.tags.outputs.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name cr-smoke -p 8000:8000                 -e ALLOW_UNREVIEWED_MODEL=true -e ENVIRONMENT=ci                 credit-risk:${{ steps.tags.outputs.sha }}
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health > /tmp/h.json; then
              cat /tmp/h.json
              exit 0
            fi
            sleep 2
          done
          docker logs cr-smoke; exit 1
      - name: Tear down
        if: always()
        run: docker rm -f cr-smoke || true
      - name: Log in to GHCR
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          SHA="${{ steps.tags.outputs.sha }}"
          docker tag credit-risk:$SHA "$IMAGE:$SHA"; docker push "$IMAGE:$SHA"
          if [[ -n "${{ steps.tags.outputs.version }}" ]]; then
            docker tag credit-risk:$SHA "$IMAGE:${{ steps.tags.outputs.version }}"
            docker push "$IMAGE:${{ steps.tags.outputs.version }}"
          fi
          if [[ "${{ steps.tags.outputs.latest }}" == "true" ]]; then
            docker tag credit-risk:$SHA "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
